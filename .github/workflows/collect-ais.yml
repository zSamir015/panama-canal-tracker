# Recolector de posiciones AIS reales del Canal (ADR-0012, guía en docs/AIS_COLLECTOR.md).
# Se conecta a AISStream 340 min (~5 h 40 min), guarda posiciones en JSON Lines, lo cifra con gpg
# y lo sube como artefacto. Al acabar con éxito el paso de comprobación de secretos y ejecutar la
# recolección, encadena la siguiente ventana con `workflow_dispatch` (si no hay otra en cola) para
# cubrir ~95 % del tiempo; el cron cada 6 h queda como respaldo por si la cadena se interrumpe.
#
# Apagado por defecto: solo corre si la variable de repositorio AIS_COLLECT_ENABLED vale `true`.
# Necesita los secretos AISSTREAM_API_KEY y AIS_COLLECT_PASSPHRASE.
#
# El repositorio es público y los artefactos de un repositorio público los puede descargar
# cualquiera con cuenta de GitHub: por eso el fichero se cifra antes de subirlo y nunca se sube en
# claro. No lo ejecutes a la vez que el worker (AISStream limita las conexiones por key).
name: Collect AIS

on:
  schedule:
    # Respaldo cada 6 horas por si la cadena de `workflow_dispatch` se corta.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutos de recolección (0 a 350)"
        default: "340"
        required: false
        type: string
      chain:
        description: "Encadenar la siguiente ventana de 340 min al terminar (desmarcar en pruebas cortas)"
        default: true
        required: false
        type: boolean

permissions: {}

# Una sola ventana a la vez (una sola conexión a AISStream). Si otra está en cola, espera.
concurrency:
  group: collect-ais
  cancel-in-progress: false

jobs:
  collect:
    name: Collect
    if: ${{ vars.AIS_COLLECT_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Máximo de un job de Actions: 360 min. Recolecta 340 y deja margen para instalar, subir y encadenar.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    # Los secretos y tokens van solo en los pasos que los usan, nunca heredados por todo el job.
    steps:
      # Antes de gastar casi 6 horas: sin los dos secretos no tiene sentido empezar (ni encadenar).
      - name: Comprobar los secretos
        id: secrets
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_COLLECT_PASSPHRASE: ${{ secrets.AIS_COLLECT_PASSPHRASE }}
        run: |
          test -n "$AISSTREAM_API_KEY" || { echo "::error::Falta el secreto AISSTREAM_API_KEY"; exit 1; }
          test -n "$AIS_COLLECT_PASSPHRASE" || { echo "::error::Falta el secreto AIS_COLLECT_PASSPHRASE"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependencias (lockfile con hashes)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Recolectar
        id: collect
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          # Por una variable de entorno y no dentro del script de la shell: evita inyección.
          MINUTES: ${{ inputs.minutes || '340' }}
        run: python scripts/ais_collect.py --minutes "$MINUTES" --output ais.jsonl
      # Se cifra aunque la recolección falle a medias: lo recogido hasta ahí también vale.
      - name: Cifrar
        if: ${{ !cancelled() && hashFiles('ais.jsonl') != '' }}
        env:
          AIS_COLLECT_PASSPHRASE: ${{ secrets.AIS_COLLECT_PASSPHRASE }}
        run: |
          printf '%s' "$AIS_COLLECT_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 --output ais.jsonl.gpg ais.jsonl
          rm ais.jsonl
      - name: Subir el fichero cifrado
        if: ${{ !cancelled() && hashFiles('ais.jsonl.gpg') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ais-${{ github.run_id }}-${{ github.run_attempt }}
          path: ais.jsonl.gpg
          if-no-files-found: error
          retention-days: 90
          # Ya está cifrado: comprimirlo no ahorra nada.
          compression-level: 0
      # Solo encadena si los secretos existen y el recolector llegó a ejecutarse (evita bucles de error).
      - name: Encadenar siguiente ventana
        if: >-
          ${{ always() && !cancelled() && vars.AIS_COLLECT_ENABLED == 'true' &&
          steps.secrets.outcome == 'success' && steps.collect.outcome != 'skipped' &&
          (github.event_name == 'schedule' || inputs.chain == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          queued=$(gh run list --workflow collect-ais.yml --status queued --json databaseId --jq 'length')
          waiting=$(gh run list --workflow collect-ais.yml --status waiting --json databaseId --jq 'length')
          if [ "$((queued + waiting))" -eq 0 ]; then
            gh workflow run collect-ais.yml --ref "$REF_NAME" -f minutes=340 -f chain=true
          else
            echo "Ya hay una ventana pendiente ($queued queued, $waiting waiting); se omite disparo duplicado."
          fi
