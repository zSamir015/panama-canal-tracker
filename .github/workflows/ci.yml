# CI (AGENTS.md §5 y §8). Cada job es un check independiente para branch protection: si se
# renombra un job, hay que actualizar la protección de `main` en el mismo momento.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el GITHUB_TOKEN no tiene ningún permiso salvo los que pide cada job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions fijadas por SHA de commit (una etiqueta se puede mover); Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (lockfile con hashes)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  typecheck:
    name: Tipos (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (lockfile con hashes)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: mypy app

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependencias (lockfile con hashes)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      # Credenciales efímeras: aleatorias en cada ejecución, enmascaradas en los logs y fuera del
      # repositorio. Nunca secretos del repo (issue #26). `.env` está en .gitignore.
      - name: Generar credenciales efímeras (.env)
        run: |
          # El `::add-mask::` tiene que salir por la salida del paso, no dentro de un `$(...)`.
          for name in postgres owner app redis jwt; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::${value}"
            printf -v "$name" '%s' "$value"
          done
          {
            echo "POSTGRES_PASSWORD=${postgres}"
            echo "CANAL_OWNER_PASSWORD=${owner}"
            echo "CANAL_APP_PASSWORD=${app}"
            echo "REDIS_PASSWORD=${redis}"
            echo "JWT_SECRET_KEY=${jwt}"
            echo "DATABASE_URL=postgresql+asyncpg://canal_app:${app}@localhost:5432/canal_tracker"
            echo "MIGRATIONS_DATABASE_URL=postgresql+asyncpg://canal_owner:${owner}@localhost:5432/canal_tracker"
            echo "REDIS_URL=redis://:${redis}@localhost:6379/0"
          } > .env
      # El mismo docker-compose.yml que en desarrollo: misma imagen (digest), roles, permisos,
      # scram-sha-256, base `canal_tracker_test` y Redis con contraseña. Los service containers de
      # Actions no pueden montar los scripts de docker/db/initdb/ ni pasar `--requirepass`.
      - name: Levantar PostgreSQL y Redis
        run: docker compose up -d --wait --wait-timeout 300
      - name: Comprobar roles, permisos y contraseñas
        run: scripts/check_dev_services.sh
      # Base vacía → migraciones; `alembic check` falla si los modelos y la migración no coinciden.
      - name: Migraciones (alembic upgrade head + check)
        run: |
          alembic upgrade head
          alembic check
      # Unitarios + integración contra PostgreSQL y Redis reales. Mínimo de cobertura: 80 %
      # (AGENTS.md §5, `fail_under` en pyproject.toml).
      - name: pytest con cobertura
        run: pytest --cov=app --cov-report=term-missing
      - name: Logs de los servicios (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 200

  images:
    name: Imágenes (docker build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin secretos: las imágenes no los necesitan para construirse (llegan por entorno al
      # arrancar). Si un cambio rompe el Dockerfile, falla aquí y no al desplegar.
      - name: Construir api y worker
        run: |
          docker build --target api -t panama-canal-tracker/api:ci .
          docker build --target worker -t panama-canal-tracker/worker:ci .
      - name: Comprobar que no corren como root y no llevan tests ni .env
        run: |
          for image in api worker; do
            uid=$(docker run --rm --entrypoint id "panama-canal-tracker/${image}:ci" -u)
            test "${uid}" = "10001"
            docker run --rm --entrypoint sh "panama-canal-tracker/${image}:ci" \
              -c 'test ! -e /srv/tests && test ! -e /srv/.env && test ! -e /srv/.git'
          done

  audit:
    name: Dependencias (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar pip-audit (versión fijada en el lockfile con hashes)
        run: pip install --require-hashes -r requirements-dev.lock
      # Audita los lockfiles tal cual (sin resolver nada de nuevo); falla con cualquier vulnerabilidad.
      - run: pip-audit --strict --disable-pip -r requirements.lock -r requirements-dev.lock

  web:
    name: Frontend (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` instala exactamente el lockfile (con sus hashes de integridad) y falla si
      # package.json y package-lock.json no coinciden; nunca resuelve versiones nuevas.
      - name: Instalar dependencias (lockfile)
        run: npm ci --no-audit --no-fund
      - run: npm run format:check
      # Incluye la regla anti-XSS (AGENTS.md §8.7): prohíbe dangerouslySetInnerHTML, innerHTML y
      # Popup.setHTML(); src/test/lint-rules.test.ts comprueba que sigue activa.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Falla con cualquier vulnerabilidad conocida, también en dependencias de desarrollo
      # (AGENTS.md §8.13).
      - run: npm audit

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz según el checksums.txt de la release oficial.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial (AGENTS.md §8.18)
          persist-credentials: false
      - name: Descargar y verificar gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Escanear todo el historial
        run: ./gitleaks git --redact --no-banner -v .
