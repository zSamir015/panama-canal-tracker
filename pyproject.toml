[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "panama-canal-tracker"
version = "0.0.0"
description = "Real-time Panama Canal vessel tracker: AIS ingestion, transit detection and live map."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Samir Herrera" }]
# Política de dependencias (AGENTS.md §8, regla de dependencias):
# - Solo se declaran paquetes que el código usa. Cada fase añade los suyos en su PR.
# - Mínimos = versiones verificadas el 2026-10-15; techo = siguiente versión mayor.
# - La instalación reproducible usa los lockfiles con hashes (requirements*.lock).
dependencies = [
    "fastapi>=0.143.2,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.16.0,<3.0",
    "structlog>=26.1.0,<27.0",
    "sqlalchemy[asyncio]>=2.1.5,<3.0",
    "asyncpg>=0.32.0,<1.0",
    "alembic>=1.20.0,<2.0",
]
# Se añadirán en su fase (no instalar antes):
#   Fase 2: geoalchemy2, pyjwt, pwdlib[argon2],
#           pydantic[email], redis (rate limiting), librería de rate limiting (ADR-0007)
#   Fase 3: websockets

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "httpx>=0.28.1,<1.0",
    "ruff>=0.17.1,<1.0",
    "mypy>=2.4.0,<3.0",
    "pip-audit>=2.10.1,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
# La carpeta `alembic/` de la raíz no es un paquete nuestro: el import es la librería instalada.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y secretos falsos permitidos en tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: necesita la base real (docker compose up -d --wait); el CI las ejecuta desde la 2.8",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
